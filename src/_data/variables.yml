default:
  text_skin: default
  highlight_theme: default
  lang: en
  paths:
    root: /
    home: /
    archive: /archive.html
    rss: /feed.xml
  mathjax: false
  mathjax_autoNumber: false
  mermaid: false
  chart: false
  toc:
    selectors: 'h1,h2,h3'

  page:
    mode: normal
    type: webpage
    article_header:
      align: left
      theme: light
    articles:
      show_cover: true
      show_excerpt: false
      show_readmore: false
      show_info: false
    show_title: true
    show_edit_on_github: false
    show_date: true
    show_tags: true
    show_author_profile: false
    show_subscribe: false
    full_width: false
    sharing: false
    comment: true
    license: false
    pageview: false
    search: default

sources:
  font_awesome: '/assets/vendor/fontawesome/css/all.min.css'
  jquery: '/assets/vendor/jquery/jquery.min.js'
  leancloud_js_sdk: '//cdn.jsdelivr.net/npm/leancloud-storage@3.13.2/dist/av-min.js'
  chart: '/assets/vendor/chart/chart.min.js'
  valine: '/assets/vendor/valine/Valine.min.js'
  mathjax: '/assets/vendor/mathjax/es5/tex-mml-chtml.js'
  mermaid: '/assets/vendor/mermaid/mermaid.min.js'
