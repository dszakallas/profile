name: Jekyll site CI - Production

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: earthly/earthly:v0.6.2
    env:
      DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
      BUCKET_NAME: "szakallas.eu"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EARTHLY_CI: 1
    steps:
    - uses: actions/checkout@v2
    - name: Build the site
      run: earthly +site --JEKYLL_ENV=production
    - name: Upload site to S3
      run: earthly --secret AWS_ACCESS_KEY_ID --secret AWS_SECRET_ACCESS_KEY +upload-to-s3 --JEKYLL_ENV=production --BUCKET_NAME=$BUCKET_NAME
    - name: Invalidate CloudFront cache
      run: earthly --secret DISTRIBUTION --secret AWS_ACCESS_KEY_ID --secret AWS_SECRET_ACCESS_KEY +invalidate-cf --BUCKET_NAME=$BUCKET_NAME
