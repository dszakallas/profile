name: Jekyll site CI - Production

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: earthly/earthly:v0.8.12
    env:
      DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
      BUCKET_NAME: "szakallas.eu"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EARTHLY_CI: 1
    steps:
    - uses: actions/checkout@v3
    - name: Build the site
      run: earthly +site --JEKYLL_ENV=production
    - name: Upload site to S3
      run: earthly --push --secret DISTRIBUTION --secret AWS_ACCESS_KEY_ID --secret AWS_SECRET_ACCESS_KEY +upload-to-s3-and-cf --JEKYLL_ENV=production --BUCKET_NAME=$BUCKET_NAME
